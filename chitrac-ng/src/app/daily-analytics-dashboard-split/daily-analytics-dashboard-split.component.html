<div class="dashboard-container" [class.dark-mode]="isDarkTheme">
  <div class="dashboard-wrapper">
    <div class="charts-grid" #chartsGrid>
      <!-- Machine Run/Pause/Fault Time Chart -->
      <app-chart-tile
        title="Machine Run/Pause/Fault Time"
        icon="bar_chart"
        [subtitle]="cacheSubtitle"
        [updatedAt]="cacheUpdatedAt"
        [chartWidth]="chartWidth"
        [chartHeight]="chartHeight"
      >
        <app-daily-machine-stacked-bar-chart
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
          [preloadedData]="preloadedData?.machineStatus"
          [useExternalTitle]="useTileTitles"
        ></app-daily-machine-stacked-bar-chart>
      </app-chart-tile>

      <!-- Machine OEE Chart -->
      <app-chart-tile
        title="Machine OEE"
        icon="insights"
        [subtitle]="cacheSubtitle"
        [updatedAt]="cacheUpdatedAt"
        [chartWidth]="chartWidth"
        [chartHeight]="chartHeight"
      >
        <app-daily-machine-oee-bar-chart
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
          [preloadedData]="preloadedData?.machineOee"
          [useExternalTitle]="useTileTitles"
        ></app-daily-machine-oee-bar-chart>
      </app-chart-tile>

      <!-- Item Totals by Type (horizontal bars, one per item) -->
      <app-chart-tile
        title="Item Totals by Type"
        icon="stacked_bar_chart"
        [subtitle]="cacheSubtitle"
        [updatedAt]="cacheUpdatedAt"
        [chartWidth]="chartWidth"
        [chartHeight]="chartHeight"
      >
        <app-daily-count-by-item-chart
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
          [preloadedData]="preloadedData?.itemTotals"
          [marginTop]="50"
          [marginRight]="30"
          [marginBottom]="50"
          [marginLeft]="120"
          [useExternalTitle]="useTileTitles"
        ></app-daily-count-by-item-chart>
      </app-chart-tile>

      <!-- Plantwide Metrics by Hour Chart -->
      <app-chart-tile
        title="Efficiency % by Machine Group"
        icon="groups"
        [subtitle]="cacheSubtitle"
        [updatedAt]="cacheUpdatedAt"
        [chartWidth]="chartWidth"
        [chartHeight]="chartHeight"
      >
        <app-efficiency-by-machine-group-bar-chart
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
          [preloadedData]="preloadedData?.machineGroupEfficiency"
          [useExternalTitle]="useTileTitles"
        ></app-efficiency-by-machine-group-bar-chart>
      </app-chart-tile>

      <!-- Top Operator Efficiency Chart -->
      <app-chart-tile
        title="Top Operator Efficiency"
        icon="leaderboard"
        [subtitle]="cacheSubtitle"
        [updatedAt]="cacheUpdatedAt"
        [chartWidth]="chartWidth"
        [chartHeight]="chartHeight"
      >
        <app-ranked-operator-bar-chart
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
          [preloadedData]="preloadedData?.topOperators"
          [useExternalTitle]="useTileTitles"
        ></app-ranked-operator-bar-chart>
      </app-chart-tile>

      <!-- Daily Plantwide Count Totals Chart -->
      <app-chart-tile
        title="Daily Plantwide Count Totals"
        icon="calendar_view_day"
        [subtitle]="'Last 28 Days'"
        [updatedAt]="cacheUpdatedAt"
        [chartWidth]="chartWidth"
        [chartHeight]="chartHeight"
      >
        <app-daily-count-bar-chart
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
          [preloadedData]="preloadedData?.dailyCounts"
          [useExternalTitle]="useTileTitles"
        ></app-daily-count-bar-chart>
      </app-chart-tile>
    </div>
  </div>
</div>
