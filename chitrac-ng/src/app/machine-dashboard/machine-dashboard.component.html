<div class="dashboard-container">
  <!-- Same structure/classes as machine-report.component.html (component load only) -->
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching data...</div>
    </div>
  </div>

  <section
    class="summary-strip"
    *ngIf="summaryCards.length"
    cdkDropList
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="onSummaryCardDrop($event)"
  >
    <article class="summary-card" *ngFor="let card of summaryCards" [ngClass]="card.tone" cdkDrag>
      <button class="drag-handle" type="button" cdkDragHandle aria-label="Move summary card">
        <mat-icon>drag_indicator</mat-icon>
      </button>
      <mat-icon>{{ card.icon }}</mat-icon>
      <div>
        <span>{{ card.label }}</span>
        <strong>{{ card.value }}</strong>
      </div>
    </article>
  </section>

  <div class="table-wrapper">
    <div class="table-container" [class.loading]="isLoading">
      <base-table
        *ngIf="rows.length"
        [columns]="columns"
        [rows]="rows"
        [columnTooltips]="columnTooltips"
        [selectedRow]="selectedRow"
        (rowClicked)="onRowClick($event)"
        [getCellClass]="getEfficiencyClass"
        [responsiveHiddenColumns]="responsiveHiddenColumns"
      ></base-table>
      <div class="empty-state" *ngIf="!rows.length && !isLoading">
        <mat-icon>query_stats</mat-icon>
        <strong>No machine data found</strong>
        <span>Try a live view, current shift, or a wider timeframe.</span>
      </div>
    </div>
  </div>

  <!-- Full-viewport frosted overlay: row click → modal only -->
  <div class="modal-loading-overlay" *ngIf="isOpeningModal">
    <div class="loading-content-modal">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching data...</div>
    </div>
  </div>
</div>
