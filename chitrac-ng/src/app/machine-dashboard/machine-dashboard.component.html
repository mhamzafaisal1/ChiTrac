<div class="dashboard-container">
  <div class="table-wrapper">
    <div class="table-container">
      <base-table
        *ngIf="rows.length"
        [columns]="columns"
        [rows]="rows"
        [selectedRow]="selectedRow"
        (rowClicked)="onRowClick($event)"
        [getCellClass]="getEfficiencyClass"
        [responsiveHiddenColumns]="responsiveHiddenColumns"
      ></base-table>
    </div>
  </div>

  <!-- Full-viewport frosted overlay (initial load + row click → modal) -->
  <div class="loading-overlay" *ngIf="isLoading || isOpeningModal">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">
        {{ isOpeningModal ? "Fetching data..." : "Loading data..." }}
      </div>
    </div>
  </div>
</div>
