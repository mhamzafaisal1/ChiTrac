<div class="dashboard-container">
  <!-- Same structure/classes as machine-report.component.html (component load only) -->
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching data...</div>
    </div>
  </div>

  <section
    class="summary-strip"
    *ngIf="summaryCards.length || layoutEditing"
    cdkDropList
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="onSummaryCardDrop($event)"
  >
    <article
      class="summary-card"
      *ngFor="let card of summaryCards"
      [ngClass]="card.tone"
      [class.has-sparkline]="card.sparklineLinePoints"
      [class.layout-editing]="layoutEditing"
      [cdkDragDisabled]="!layoutEditing"
      cdkDrag
    >
      <button class="drag-handle" type="button" cdkDragHandle aria-label="Move summary card" *ngIf="layoutEditing">
        <mat-icon>drag_indicator</mat-icon>
      </button>
      <mat-icon class="summary-icon">{{ card.icon }}</mat-icon>
      <div class="summary-copy">
        <span>{{ card.label }}</span>
        <strong>{{ card.value }}</strong>
      </div>
      <div class="summary-sparkline" *ngIf="card.sparklineLinePoints" aria-hidden="true">
        <svg viewBox="0 0 160 48" preserveAspectRatio="none" focusable="false">
          <path class="sparkline-fill" [attr.d]="card.sparklineAreaPath"></path>
          <polyline
            class="sparkline-line"
            *ngFor="let segment of card.sparklineSegments"
            [class.break]="segment.shiftState === 'break'"
            [class.outside-shift]="segment.shiftState === 'outsideShift'"
            [attr.points]="segment.linePoints"
          ></polyline>
        </svg>
      </div>
    </article>
    <button
      class="summary-card summary-card-config"
      type="button"
      *ngIf="layoutEditing"
      (click)="openSummaryCardVisibilityDialog()"
      aria-label="Show or hide infoboxes"
    >
      <mat-icon class="summary-icon">visibility</mat-icon>
      <div class="summary-copy">
        <span>Layout</span>
        <strong>Show/Hide Infoboxes</strong>
      </div>
    </button>
  </section>

  <div class="table-wrapper">
    <div class="table-container" [class.loading]="isLoading">
      <base-table
        *ngIf="rows.length"
        [columns]="columns"
        [rows]="rows"
        [columnTooltips]="columnTooltips"
        [selectedRow]="selectedRow"
        (rowClicked)="onRowClick($event)"
        [getCellClass]="getEfficiencyClass"
        [responsiveHiddenColumns]="responsiveHiddenColumns"
        [columnEditMode]="layoutEditing"
        [toggleableColumns]="machineDashboardToggleableColumns"
        [columnVisibility]="tableColumnVisibility"
        (columnVisibilityChange)="onTableColumnVisibilityChange($event)"
      ></base-table>
      <div class="empty-state" *ngIf="!rows.length && !isLoading">
        <mat-icon>query_stats</mat-icon>
        <strong>No machine data found</strong>
        <span>Try a live view, current shift, or a wider timeframe.</span>
      </div>
    </div>
  </div>

  <!-- Full-viewport frosted overlay: row click → modal only -->
  <div class="modal-loading-overlay" *ngIf="isOpeningModal">
    <div class="loading-content-modal">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching data...</div>
    </div>
  </div>
</div>
