<app-page-load-state [loading]="isLoading" [error]="error" label="Loading machines…" (retry)="retryLoad()"></app-page-load-state>
<div [attr.inert]="isLoading || error ? '' : null" [attr.aria-busy]="isLoading">
<base-table
  [columns]="displayedColumns"
  [columnOptions]="columnOptions"
  [rows]="machines"
  [rowIdentity]="rowIdentity"
  [selectedRow]="selectedRow"
  [pageSizes]="pageSizes"
  [enableCsvExport]="false"
  [fillAvailableWidth]="true"
  [emptyMessage]="!isLoading && !error ? 'No machines found.' : ''"
  (rowClicked)="selectedRow = $event"
></base-table>

<mat-divider></mat-divider>

<div class="cud-buttons">
  <button mat-flat-button (click)="openDialog(null)">
    <mat-icon>add</mat-icon>New Machine
  </button>
  <button
    mat-flat-button
    [disabled]="!selectedRow"
    (click)="selectedRow && openDialog(selectedRow)"
  >
    <mat-icon>edit</mat-icon>Edit Machine
  </button>
  <button
    mat-flat-button
    [disabled]="!selectedRow"
    (click)="selectedRow && deleteMachine(selectedRow)"
  >
    <mat-icon>delete</mat-icon>Delete Machine
  </button>
</div>

</div>
