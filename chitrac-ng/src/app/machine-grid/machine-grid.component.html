<table mat-table [dataSource]="dataSource" matSort>
  <ng-container matColumnDef="serial">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Serial</th>
    <td mat-cell *matCellDef="let machine">{{ machine.serial }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let machine">{{ machine.name }}</td>
  </ng-container>

  <ng-container matColumnDef="ipAddress">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>IP Address</th>
    <td mat-cell *matCellDef="let machine">{{ machine.ipAddress }}</td>
  </ng-container>

  <ng-container matColumnDef="lanes">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Lanes</th>
    <td mat-cell *matCellDef="let machine">{{ machine.lanes }}</td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Active</th>
    <td mat-cell *matCellDef="let machine">
      {{ machine.active ? "Active" : "Inactive" }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    [ngClass]="{ selectedRow: selectionModel.isSelected(row) }"
    (click)="selectionModel.toggle(row)"
  ></tr>
</table>

<mat-paginator
  [pageSize]="paginationSize"
  [pageSizeOptions]="[5, 10, 25, 100]"
  (page)="handlePageEvent($event)"
  aria-label="Select page"
></mat-paginator>

<mat-divider></mat-divider>

<div class="cud-buttons">
  <button mat-flat-button (click)="openDialog(null)">
    <mat-icon>add</mat-icon>New Machine
  </button>
  <button
    mat-flat-button
    [disabled]="selectionModel.selected.length === 0"
    (click)="openDialog(selectionModel.selected[0])"
  >
    <mat-icon>edit</mat-icon>Edit Machine
  </button>
  <button
    mat-flat-button
    [disabled]="selectionModel.selected.length === 0"
    (click)="deleteMachine(selectionModel.selected[0])"
  >
    <mat-icon>delete</mat-icon>Delete Machine
  </button>
</div>

<div *ngIf="error" class="error-message">{{ error }}</div>
