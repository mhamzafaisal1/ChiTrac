<div class="scroll-wrapper" [class.modal-view]="isModal">
  <div
    class="fault-container"
    [ngClass]="{ 'dark-mode': isDarkTheme, 'light-mode': !isDarkTheme }"
  >
    <div class="controls" *ngIf="!isModal">
      <!-- View Type Toggle -->
      <div class="view-type-toggle">
        <mat-form-field appearance="fill">
          <mat-label>View Type</mat-label>
          <mat-select [(ngModel)]="viewType">
            <mat-option value="summary">Fault Summaries</mat-option>
            <mat-option value="cycles">Fault History</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Start Time -->
      <app-date-time-picker
        label="Start Time"
        [(value)]="startTime"
      ></app-date-time-picker>

      <!-- End Time -->
      <app-date-time-picker
        label="End Time"
        [(value)]="endTime"
      ></app-date-time-picker>

      <!-- Serial Input -->
      <div class="serial-input-group">
        <div class="form-group">
          <label for="serial">Serial Number:</label>
          <input
            type="text"
            id="serial"
            [(ngModel)]="serial"
            placeholder="Enter machine serial number"
          />
        </div>
        
        <!-- Fetch Button -->
        <button
          mat-flat-button
          color="primary"
          (click)="fetchData()"
          [disabled]="!startTime || !endTime || !serial"
        >
          Fetch Fault History
        </button>
      </div>
    </div>

    <div class="fault-content">
      <base-table
        *ngIf="rows.length && !hasLoadError"
        [columns]="columns"
        [rows]="rows"
        [selectedRow]="selectedRow"
        [disableSorting]="false"
        [fillAvailableWidth]="isModal"
        [enableSearch]="!isModal"
        [enableCsvExport]="!isModal"
        (rowClicked)="onRowSelected($event)"
      ></base-table>
      <div class="chart-no-data" *ngIf="hasFetchedOnce && !isLoading && !hasLoadError && !rows.length" role="status">
        <div class="chart-no-data-content">
          <div class="chart-no-data-icon" aria-hidden="true">{{ '\uD83D\uDCCA' }}</div>
          <div class="chart-no-data-text">No faults recorded for the selected time range.</div>
        </div>
      </div>
      <div class="chart-no-data" *ngIf="isLoading && !rows.length" role="status" aria-live="polite">
        <div class="chart-no-data-text">Loading fault data...</div>
      </div>
      <div class="chart-no-data" *ngIf="hasLoadError && !isLoading" role="alert">
        <div class="chart-no-data-text">Unable to load fault data. Please try again.</div>
      </div>
    </div>
  </div>
</div>
