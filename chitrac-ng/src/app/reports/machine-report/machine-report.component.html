<div class="dashboard-container" [class.dark-mode]="isDarkTheme">
  <div class="loading-overlay" *ngIf="isLoading || isEmailing">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">
        {{
          isEmailing
            ? "Sending email..."
            : isDownloading
              ? "Downloading PDF..."
              : isDownloadingCsv
                ? "Downloading CSV..."
                : "Fetching data..."
        }}
      </div>
    </div>
  </div>

  <div class="controls">
    <app-timeframe-picker
      confirmLabel="Generate Report"
      [start]="startTime"
      [end]="endTime"
      [shiftId]="selectedShiftId"
      [mode]="timeframeMode"
      [disabled]="isLoading || isEmailing"
      (confirmed)="applyTimeframe($event)"
    ></app-timeframe-picker>

    <div class="button-group">
      <button
        mat-flat-button
        color="primary"
        (click)="downloadMachineItemSummaryPdf()"
        [disabled]="!rows.length || isLoading || isEmailing"
      >
        <mat-icon>picture_as_pdf</mat-icon>
        {{
          isLoading && isDownloading
            ? "Downloading..."
            : "Download Machine Item Summary PDF"
        }}
      </button>

      <button
        mat-flat-button
        color="primary"
        (click)="openEmailReportDialog()"
        [disabled]="!rows.length || isLoading || isEmailing"
      >
        <mat-icon>email</mat-icon>
        {{ isEmailing ? "Sending..." : "Email PDF" }}
      </button>

      <button
        mat-flat-button
        color="primary"
        (click)="downloadMachineItemSummaryCsv()"
        [disabled]="!rows.length || isLoading || isEmailing"
      >
        <mat-icon>table_chart</mat-icon>
        {{ isLoading && isDownloadingCsv ? "Downloading..." : "Download CSV" }}
      </button>
    </div>
  </div>

  <div class="table-container" [class.loading]="isLoading">
    <base-table *ngIf="reportGroups.length"
      [columns]="summaryColumns" [rows]="rows"
      [rowGroups]="reportGroups" groupIdentityColumn="Machine"
      [columnTooltips]="columnTooltips" [getCellTooltip]="getCellTooltip"
      [enableToolbar]="false" [fillAvailableWidth]="true"
      [columnEditMode]="layout.editing" [columnReorderOnly]="true"
      [columnOrder]="layout.columns" (columnOrderChange)="layout.setOrder($event)"
    ></base-table>
  </div>
</div>
