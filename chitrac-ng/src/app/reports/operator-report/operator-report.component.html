<div class="dashboard-container" [class.dark-mode]="isDarkTheme">
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">
        {{ isDownloading ? "Downloading PDF..." : isDownloadingCsv ? "Downloading CSV..." : "Fetching data..." }}
      </div>
    </div>
  </div>

  <div class="controls">
    <app-timeframe-picker
      confirmLabel="Generate Report"
      [start]="startTime"
      [end]="endTime"
      [shiftId]="selectedShiftId"
      [mode]="timeframeMode"
      [disabled]="isLoading"
      (confirmed)="applyTimeframe($event)"
    ></app-timeframe-picker>

    <div class="button-group">
      <button
        mat-flat-button
        color="primary"
        (click)="downloadOperatorSummaryPdf()"
        [disabled]="!rows.length || isLoading"
      >
        <mat-icon>picture_as_pdf</mat-icon>
        {{
          isLoading && isDownloading
            ? "Downloading..."
            : "Download Operator Report PDF"
        }}
      </button>

      <button
        mat-flat-button
        color="primary"
        (click)="downloadOperatorSummaryCsv()"
        [disabled]="!rows.length || isLoading"
      >
        <mat-icon>table_chart</mat-icon>
        {{ isLoading && isDownloadingCsv ? "Downloading..." : "Download CSV" }}
      </button>
    </div>
  </div>

  <div class="table-container" [class.loading]="isLoading">
    <base-table *ngIf="reportGroups.length"
      [columns]="summaryColumns" [rows]="rows"
      [rowGroups]="reportGroups" groupIdentityColumn="Operator"
      [columnTooltips]="columnTooltips" [getCellTooltip]="getCellTooltip"
      [enableToolbar]="false" [fillAvailableWidth]="true"
      [columnEditMode]="layout.editing" [columnReorderOnly]="true"
      [columnOrder]="layout.columns" (columnOrderChange)="layout.setOrder($event)"
    ></base-table>
  </div>
</div>
