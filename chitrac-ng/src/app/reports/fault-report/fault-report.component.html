<div class="dashboard-container" [class.dark-mode]="isDarkTheme">
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Fetching data...</div>
    </div>
  </div>

  <div class="controls">
    <app-date-time-picker
      label="Start Time"
      [(value)]="startTime"
    ></app-date-time-picker>
    <app-date-time-picker
      label="End Time"
      [(value)]="endTime"
    ></app-date-time-picker>

    <div class="button-group">
      <button
        mat-flat-button
        color="primary"
        (click)="fetchFaultReport()"
        [disabled]="!startTime || !endTime || isLoading"
      >
        <mat-icon>refresh</mat-icon>
        {{ isLoading ? "Loading..." : "Fetch Data" }}
      </button>
      <button
        mat-flat-button
        color="primary"
        (click)="downloadPdf()"
        [disabled]="!reportGroups.length || isLoading"
      >
        <mat-icon>picture_as_pdf</mat-icon>
        {{ isDownloading ? "Downloading..." : "Download Fault Report PDF" }}
      </button>
      <button
        mat-flat-button
        color="primary"
        (click)="downloadCsv()"
        [disabled]="!reportGroups.length || isLoading"
      >
        <mat-icon>table_chart</mat-icon>
        {{ isDownloadingCsv ? "Downloading..." : "Download CSV" }}
      </button>
    </div>
  </div>

  <div class="table-container" [class.loading]="isLoading" *ngIf="reportGroups.length">
    <div class="summary-header report-grid" role="row">
      <button
        type="button"
        class="sort-header"
        *ngFor="let column of summaryColumns"
        (click)="sortBySummary(column)"
      >
        <span>{{ column }}</span>
        <mat-icon *ngIf="sortColumn === column">
          {{ sortDirection === "asc" ? "arrow_upward" : "arrow_downward" }}
        </mat-icon>
      </button>
    </div>

    <section
      class="fault-group"
      *ngFor="let group of reportGroups; trackBy: trackGroupByKey"
    >
      <button
        type="button"
        class="summary-row report-grid"
        [class.expanded]="isGroupExpanded(group)"
        [attr.aria-expanded]="isGroupExpanded(group)"
        (click)="toggleGroup(group)"
      >
        <span class="fault-cell">
          <mat-icon>
            {{ isGroupExpanded(group) ? "expand_more" : "chevron_right" }}
          </mat-icon>
          <span class="entity-name">{{ group.summary["Fault"] }}</span>
          <span class="detail-count" *ngIf="group.details.length">
            {{ group.details.length }}
            {{ group.details.length === 1 ? "occurrence" : "occurrences" }}
          </span>
        </span>
        <span>{{ group.summary["Count"] }}</span>
        <span>{{ group.summary["Total Duration"] }}</span>
      </button>

      <div class="detail-panel" *ngIf="isGroupExpanded(group)">
        <table class="detail-table" *ngIf="group.details.length; else noFaultDetails">
          <colgroup>
            <col class="primary-column" />
            <col class="count-column" />
            <col class="duration-column" />
          </colgroup>
          <thead>
            <tr>
              <th *ngFor="let column of detailColumns">{{ column }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let detail of group.details">
              <td>{{ detail["Timestamp"] }}</td>
              <td [attr.title]="getMachineTooltip(detail)">
                {{ detail["Machine"] }}
              </td>
              <td>{{ detail["Duration"] }}</td>
            </tr>
          </tbody>
        </table>
        <ng-template #noFaultDetails>
          <div class="empty-details">No individual fault history available</div>
        </ng-template>
      </div>
    </section>
  </div>
</div>
