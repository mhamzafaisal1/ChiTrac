<div class="dashboard-container" [class.dark-mode]="isDarkTheme">
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">
        {{ isDownloading ? "Downloading PDF..." : isDownloadingCsv ? "Downloading CSV..." : "Fetching data..." }}
      </div>
    </div>
  </div>

  <div class="controls">
    <app-timeframe-picker
      confirmLabel="Generate Report"
      [start]="startTime"
      [end]="endTime"
      [shiftId]="selectedShiftId"
      [mode]="timeframeMode"
      [disabled]="isLoading"
      (confirmed)="applyTimeframe($event)"
    ></app-timeframe-picker>

    <div class="button-group">
      <button
        mat-flat-button
        color="primary"
        (click)="downloadItemSummaryPdf()"
        [disabled]="!rows.length || isLoading"
      >
        <mat-icon>picture_as_pdf</mat-icon>
        {{
          isLoading && isDownloading
            ? "Downloading..."
            : "Download Item Summary PDF"
        }}
      </button>

      <button
        mat-flat-button
        color="primary"
        (click)="downloadItemSummaryCsv()"
        [disabled]="!rows.length || isLoading"
      >
        <mat-icon>table_chart</mat-icon>
        {{ isLoading && isDownloadingCsv ? "Downloading..." : "Download CSV" }}
      </button>
    </div>
  </div>

  <div class="table-container" [class.loading]="isLoading">
    <base-table
      *ngIf="rows.length"
      [class.dark]="isDarkTheme"
      [class.light]="!isDarkTheme"
      [columns]="columns"
      [rows]="rows"
      [columnTooltips]="columnTooltips"
      [getCellTooltip]="getCellTooltip"
      [fillAvailableWidth]="true"
      style="height:93%; border-radius: 4px;"
    >
    </base-table>
  </div>
</div>
