<div class="table-wrapper">
    <div class="table-container" [class.loading]="loading">
      <base-table
        *ngIf="!loading && itemRows.length"
        [columns]="itemColumns"
        [rows]="itemRows"
        [getCellClass]="getEfficiencyClass"
        [enableSearch]="!isModal"
        [enableCsvExport]="!isModal"
        [class.dark]="isDarkTheme"
        [class.light]="!isDarkTheme"
      ></base-table>
    </div>
  </div>
