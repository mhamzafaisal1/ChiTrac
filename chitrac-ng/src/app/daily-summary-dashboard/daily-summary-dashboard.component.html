<div class="scroll-wrapper">
  <div class="container" [ngClass]="{ 'dark-mode': isDarkTheme, 'light-mode': !isDarkTheme }">
    <section
      class="summary-strip"
      *ngIf="summaryCards.length || layoutEditing"
      cdkDropList
      cdkDropListOrientation="mixed"
      (cdkDropListDropped)="onSummaryCardDrop($event)"
    >
      <article
        class="summary-card"
        *ngFor="let card of summaryCards"
        [ngClass]="card.tone"
        [class.layout-editing]="layoutEditing"
        [cdkDragDisabled]="!layoutEditing"
        cdkDrag
      >
        <mat-icon>{{ card.icon }}</mat-icon>
        <div>
          <span>{{ card.label }}</span>
          <strong>{{ card.value }}</strong>
        </div>
      </article>
      <button
        class="summary-card summary-card-config"
        type="button"
        *ngIf="layoutEditing"
        (click)="openSummaryCardVisibilityDialog()"
        aria-label="Show or hide infoboxes"
      >
        <mat-icon>visibility</mat-icon>
        <div>
          <span>Layout</span>
          <strong>Show/Hide Infoboxes</strong>
        </div>
      </button>
    </section>

    <div class="tables-wrapper">
      <!-- Loading Overlay for initial load -->
      <div class="loading-overlay" *ngIf="isLoading">
        <div class="loading-content">
          <div class="loading-spinner"></div>
          <div class="loading-text">
            Loading data...
          </div>
        </div>
      </div>

      <div class="tables-container" [class.loading]="isLoading">
        <div class="table-section" *ngIf="machineRows.length">
          <base-table
          [class.dark]="isDarkTheme"
          [class.light]="!isDarkTheme"
          [columns]="machineColumns"
          [rows]="machineRows"
          [selectedRow]="selectedRow"
          (rowClicked)="onMachineClick($event)"
          [getCellClass]="getPerformanceClass"
          [enableSearch]="false"
          [enableCsvExport]="false"
          >
        </base-table>          
        </div>
        
        <div class="table-section" *ngIf="operatorRows.length">
          <base-table
            [class.dark]="isDarkTheme"
            [class.light]="!isDarkTheme"
            [columns]="operatorColumns"
            [rows]="operatorRows"
            [selectedRow]="selectedOperator"
            [getCellClass]="getPerformanceClass"
            [enableSearch]="false"
            [enableCsvExport]="false"
            (rowClicked)="onOperatorClick($event)"
            >
          </base-table>
        </div>
    
        <div class="table-section" *ngIf="itemRows.length">
          <base-table
            [class.dark]="isDarkTheme"
            [class.light]="!isDarkTheme"
            [columns]="itemColumns"
            [rows]="itemRows"
            [enableSearch]="false"
            [enableCsvExport]="false">
          </base-table>
        </div>

        <!-- Empty state placeholder to maintain height -->
        <div *ngIf="!machineRows.length && !operatorRows.length && !itemRows.length" class="empty-state">
          <div class="empty-content">
            <div class="empty-text">No data available</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
