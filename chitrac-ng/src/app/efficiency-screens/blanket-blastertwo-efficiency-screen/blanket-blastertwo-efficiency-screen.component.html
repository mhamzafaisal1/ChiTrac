<div class="screen-container">
  <div class="lanes-wrapper" *ngIf="!isLoading && (lanes.length || machineLane)">
    <div class="lane-container" *ngFor="let lane of lanes; trackBy: ident">
      <app-efficiency-screen-lane [lane]="lane" [mode]="getLaneMode(lane)"></app-efficiency-screen-lane>
    </div>
    <div class="lane-container" *ngIf="machineLane">
      <app-efficiency-screen-lane [lane]="machineLane" mode="oee"></app-efficiency-screen-lane>
    </div>
  </div>
  <div class="no-data-container" *ngIf="isLoading" role="status">
    <div class="no-data-text">Loading Blanket Blaster data...</div>
  </div>
  <div class="no-data-container" *ngIf="!isLoading && !lanes.length && !machineLane">
    <div class="no-data-text">No Blanket Blaster data</div>
  </div>
</div>
