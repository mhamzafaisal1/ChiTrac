<app-page-load-state [loading]="isLoading" [error]="error" label="Loading operators…" (retry)="retryLoad()"></app-page-load-state>
<div [attr.inert]="isLoading || error ? '' : null" [attr.aria-busy]="isLoading">
<base-table
  [columns]="displayedColumns"
  [columnOptions]="columnOptions"
  [rows]="operators"
  [rowIdentity]="rowIdentity"
  [selectedRow]="selectedRow"
  [pageSizes]="pageSizes"
  [enableCsvExport]="false"
  [fillAvailableWidth]="true"
  [emptyMessage]="!isLoading && !error ? 'No operators found.' : ''"
  (rowClicked)="selectedRow = $event"
></base-table>
<mat-divider></mat-divider>
<div class="cud-buttons">
    <button mat-flat-button (click)="openDialog(null)"><mat-icon>add</mat-icon>New Operator</button>
    <button mat-flat-button [disabled]="!selectedRow" (click)="selectedRow && openDialog(selectedRow)"><mat-icon>edit</mat-icon>Edit Operator</button>
    <button mat-flat-button [disabled]="!selectedRow" (click)="selectedRow && deleteOperator(selectedRow)"><mat-icon>delete</mat-icon>Delete Operator</button>
    <button mat-flat-button [disabled]="!operators.length || isDownloading" (click)="downloadOperatorsPdf()">
        <mat-icon>download</mat-icon>{{ isDownloading ? 'Exporting...' : 'Export PDF' }}
    </button>
</div>

</div>
