<div class="date-time-menu">
  <div class="picker-section">
    <!-- Start Date -->
    <mat-form-field>
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDateTime" [disabled]="isDisabled()" />
      <mat-datepicker-toggle matSuffix [for]="startPicker" [disabled]="isDisabled()"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <!-- Start Time -->
    <mat-form-field>
      <mat-label>Start Time</mat-label>
      <input matInput [matTimepicker]="startTimePicker" [(ngModel)]="startDateTime" [disabled]="isDisabled()" />
      <mat-timepicker-toggle matSuffix [for]="startTimePicker" [disabled]="isDisabled()"></mat-timepicker-toggle>
      <mat-timepicker #startTimePicker></mat-timepicker>
    </mat-form-field>

    <!-- End Date -->
    <mat-form-field>
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDateTime" [disabled]="isDisabled()" />
      <mat-datepicker-toggle matSuffix [for]="endPicker" [disabled]="isDisabled()"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>

    <!-- End Time -->
    <mat-form-field>
      <mat-label>End Time</mat-label>
      <input matInput [matTimepicker]="endTimePicker" [(ngModel)]="endDateTime" [disabled]="isDisabled()" />
      <mat-timepicker-toggle matSuffix [for]="endTimePicker" [disabled]="isDisabled()"></mat-timepicker-toggle>
      <mat-timepicker #endTimePicker></mat-timepicker>
    </mat-form-field>

    <div class="action-row">
      <button mat-flat-button color="primary" (click)="confirm()">
        <mat-icon>done</mat-icon>
        Confirm
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="mode-section">
    <div class="timeframe-buttons">
      <button
        mat-stroked-button
        [class.selected]="selectedOption === 'today'"
        (click)="selectToday()">
        Today
      </button>

      <p class="shift-hint" *ngIf="shiftsLoadError">{{ shiftsLoadError }}</p>
      <button
        *ngFor="let s of shifts"
        mat-stroked-button
        [class.selected]="selectedOption === 'shift:' + s._id"
        (click)="selectShift(s._id)">
        {{ s.name || 'Shift' }}
      </button>

      <button mat-stroked-button [class.selected]="selectedOption === 'thisWeek'" (click)="onTimeframeSelect('thisWeek')">
        This Week
      </button>
      <button mat-stroked-button [class.selected]="selectedOption === 'thisMonth'" (click)="onTimeframeSelect('thisMonth')">
        This Month
      </button>
      <button mat-stroked-button [class.selected]="selectedOption === 'thisYear'" (click)="onTimeframeSelect('thisYear')">
        This Year
      </button>
      <button mat-stroked-button [class.selected]="selectedOption === 'custom'" (click)="selectCustom()">
        Custom
      </button>
    </div>
  </div>
</div>
