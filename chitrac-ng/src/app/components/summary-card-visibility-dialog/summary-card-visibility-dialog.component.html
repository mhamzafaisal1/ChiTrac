<div class="visibility-dialog">
  <header class="dialog-header">
    <div>
      <h2 mat-dialog-title>{{ title }}</h2>
      <p>{{ description }}</p>
    </div>
  </header>

  <mat-dialog-content>
    <div
      class="limit-message"
      *ngIf="visibleCountMessage"
      [class.invalid]="!canApply"
    >
      {{ visibleCountMessage }}
    </div>
    <div class="list-grid">
      <section class="list-panel" aria-label="Show infoboxes">
        <h3>{{ showLabel }}</h3>
        <button
          type="button"
          class="infobox-row"
          [class.compact]="compactCards"
          *ngFor="let card of showCards"
          [class.selected]="selectedShowLabel === card.label"
          (click)="selectShow(card.label)"
          [ngClass]="card.tone"
          [class.has-sparkline]="card.sparklineLinePoints"
        >
          <article
            class="summary-card-preview"
            [class.compact]="compactCards"
            [ngClass]="card.tone"
            [class.has-sparkline]="card.sparklineLinePoints"
          >
            <mat-icon class="summary-icon" *ngIf="card.icon">{{ card.icon }}</mat-icon>
            <div class="summary-copy">
              <span>{{ card.label }}</span>
              <strong *ngIf="!compactCards">{{ card.value }}</strong>
            </div>
            <div class="summary-sparkline" *ngIf="card.sparklineLinePoints" aria-hidden="true">
              <svg viewBox="0 0 160 48" preserveAspectRatio="none" focusable="false">
                <path class="sparkline-fill" [attr.d]="card.sparklineAreaPath"></path>
                <polyline class="sparkline-line" [attr.points]="card.sparklineLinePoints"></polyline>
              </svg>
            </div>
          </article>
        </button>
        <div class="empty-list" *ngIf="!showCards.length">{{ emptyShownText }}</div>
      </section>

      <div class="transfer-actions" aria-label="Move selected infobox">
        <button mat-icon-button type="button" aria-label="Hide selected infobox" [disabled]="!selectedShowLabel" (click)="hideSelected()">
          <mat-icon>chevron_right</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Show selected infobox" [disabled]="!selectedHideLabel" (click)="showSelected()">
          <mat-icon>chevron_left</mat-icon>
        </button>
      </div>

      <section class="list-panel" aria-label="Hide infoboxes">
        <h3>{{ hideLabel }}</h3>
        <button
          type="button"
          class="infobox-row"
          [class.compact]="compactCards"
          *ngFor="let card of hideCards"
          [class.selected]="selectedHideLabel === card.label"
          (click)="selectHide(card.label)"
          [ngClass]="card.tone"
          [class.has-sparkline]="card.sparklineLinePoints"
        >
          <article
            class="summary-card-preview"
            [class.compact]="compactCards"
            [ngClass]="card.tone"
            [class.has-sparkline]="card.sparklineLinePoints"
          >
            <mat-icon class="summary-icon" *ngIf="card.icon">{{ card.icon }}</mat-icon>
            <div class="summary-copy">
              <span>{{ card.label }}</span>
              <strong *ngIf="!compactCards">{{ card.value }}</strong>
            </div>
            <div class="summary-sparkline" *ngIf="card.sparklineLinePoints" aria-hidden="true">
              <svg viewBox="0 0 160 48" preserveAspectRatio="none" focusable="false">
                <path class="sparkline-fill" [attr.d]="card.sparklineAreaPath"></path>
                <polyline class="sparkline-line" [attr.points]="card.sparklineLinePoints"></polyline>
              </svg>
            </div>
          </article>
        </button>
        <div class="empty-list" *ngIf="!hideCards.length">{{ emptyHiddenText }}</div>
      </section>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="!canApply" (click)="save()">Apply</button>
  </mat-dialog-actions>
</div>
