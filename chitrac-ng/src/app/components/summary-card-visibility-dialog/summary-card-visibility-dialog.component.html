<div class="visibility-dialog">
  <header class="dialog-header">
    <div>
      <h2 mat-dialog-title>{{ title }}</h2>
      <p *ngIf="description">{{ description }}</p>
    </div>
  </header>

  <mat-dialog-content>
    <fieldset class="layout-options" *ngIf="layoutOptions.length" [disabled]="saving">
      <legend>Chart layout</legend>
      <label *ngFor="let option of layoutOptions" [class.selected]="selectedLayout === option.id">
        <input type="radio" name="chart-layout" [value]="option.id"
          [checked]="selectedLayout === option.id" (change)="selectLayout(option.id)" />
        <span>{{ option.label }}</span>
      </label>
    </fieldset>
    <div
      class="limit-message"
      *ngIf="visibleCountMessage"
      [class.invalid]="!canApply"
      role="status"
    >
      {{ visibleCountMessage }}
    </div>
    <p *ngIf="saveError" role="alert">{{ saveError }}</p>
    <div class="list-grid" [attr.inert]="saving ? '' : null" [attr.aria-busy]="saving">
      <section class="list-panel" [attr.aria-label]="showLabel">
        <h3>{{ showLabel }}</h3>
        <div
          id="shown-card-list"
          class="card-drop-list"
          cdkScrollable
          cdkDropList
          [cdkDropListData]="showCards"
          [cdkDropListConnectedTo]="['hidden-card-list']"
          [cdkDropListDisabled]="!dragDropEnabled"
          [cdkDropListEnterPredicate]="canEnterShow"
          (cdkDropListDropped)="drop($event, true)"
        >
          <button
            type="button"
            class="infobox-row"
            [class.compact]="compactCards"
            *ngFor="let card of showCards"
            [attr.aria-label]="card.label"
            [attr.aria-pressed]="selectedShowId === (card.id || card.label)"
            cdkDrag
            [cdkDragDisabled]="!dragDropEnabled"
            [class.draggable]="dragDropEnabled"
            [class.selected]="selectedShowId === (card.id || card.label)"
            (click)="selectShow(card)"
            [ngClass]="card.tone"
            [class.has-sparkline]="card.sparklineLinePoints"
          >
            <article
              class="summary-card-preview"
              [class.compact]="compactCards"
              [ngClass]="card.tone"
              [class.has-sparkline]="card.sparklineLinePoints"
            >
              <mat-icon class="summary-icon" *ngIf="card.icon">{{ card.icon }}</mat-icon>
              <div class="summary-copy">
                <span>{{ card.label }}</span>
                <strong *ngIf="!compactCards">{{ card.value }}</strong>
              </div>
              <div class="summary-sparkline" *ngIf="card.sparklineLinePoints" aria-hidden="true">
                <svg viewBox="0 0 160 48" preserveAspectRatio="none" focusable="false">
                  <path class="sparkline-fill" [attr.d]="card.sparklineAreaPath"></path>
                  <polyline class="sparkline-line" [attr.points]="card.sparklineLinePoints"></polyline>
                </svg>
              </div>
            </article>
          </button>
          <div class="empty-list" *ngIf="!showCards.length">{{ emptyShownText }}</div>
        </div>
      </section>

      <div class="transfer-actions" role="group" aria-label="Move selected entries">
        <button mat-icon-button type="button" [attr.aria-label]="hideLabel + ' all'" [matTooltip]="hideLabel + ' all'" [disabled]="!showCards.length" (click)="hideAll()">
          <mat-icon>keyboard_double_arrow_right</mat-icon>
        </button>
        <button mat-icon-button type="button" [attr.aria-label]="hideLabel + ' selected'" [matTooltip]="hideLabel + ' selected'" [disabled]="!selectedShowId" (click)="hideSelected()">
          <mat-icon>chevron_right</mat-icon>
        </button>
        <button mat-icon-button type="button" [attr.aria-label]="showLabel + ' selected'" [matTooltip]="showLabel + ' selected'" [disabled]="!selectedHideId || !canShowMore" (click)="showSelected()">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button mat-icon-button type="button" [attr.aria-label]="showLabel + ' all'" [matTooltip]="showLabel + ' all'" [disabled]="!canShowAll" (click)="showAll()">
          <mat-icon>keyboard_double_arrow_left</mat-icon>
        </button>
      </div>

      <section class="list-panel" [attr.aria-label]="hideLabel">
        <h3>{{ hideLabel }}</h3>
        <div
          id="hidden-card-list"
          class="card-drop-list"
          cdkScrollable
          cdkDropList
          [cdkDropListData]="hideCards"
          [cdkDropListConnectedTo]="['shown-card-list']"
          [cdkDropListDisabled]="!dragDropEnabled"
          (cdkDropListDropped)="drop($event, false)"
        >
          <button
            type="button"
            class="infobox-row"
            [class.compact]="compactCards"
            *ngFor="let card of hideCards"
            [attr.aria-label]="card.label"
            [attr.aria-pressed]="selectedHideId === (card.id || card.label)"
            cdkDrag
            [cdkDragDisabled]="!dragDropEnabled"
            [class.draggable]="dragDropEnabled"
            [class.selected]="selectedHideId === (card.id || card.label)"
            (click)="selectHide(card)"
            [ngClass]="card.tone"
            [class.has-sparkline]="card.sparklineLinePoints"
          >
            <article
              class="summary-card-preview"
              [class.compact]="compactCards"
              [ngClass]="card.tone"
              [class.has-sparkline]="card.sparklineLinePoints"
            >
              <mat-icon class="summary-icon" *ngIf="card.icon">{{ card.icon }}</mat-icon>
              <div class="summary-copy">
                <span>{{ card.label }}</span>
                <strong *ngIf="!compactCards">{{ card.value }}</strong>
              </div>
              <div class="summary-sparkline" *ngIf="card.sparklineLinePoints" aria-hidden="true">
                <svg viewBox="0 0 160 48" preserveAspectRatio="none" focusable="false">
                  <path class="sparkline-fill" [attr.d]="card.sparklineAreaPath"></path>
                  <polyline class="sparkline-line" [attr.points]="card.sparklineLinePoints"></polyline>
                </svg>
              </div>
            </article>
          </button>
          <div class="empty-list" *ngIf="!hideCards.length">{{ emptyHiddenText }}</div>
        </div>
      </section>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="saving" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="saving || !canApply" (click)="save()">{{ saving ? 'Saving...' : applyLabel }}</button>
  </mat-dialog-actions>
</div>
