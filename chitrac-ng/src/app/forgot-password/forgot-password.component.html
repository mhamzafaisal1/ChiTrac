<div class="forgot-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-form">
    <h2 class="title">Forgot password</h2>
    <p class="hint">Enter the email address on your ChiTrac account. We’ll send a reset link if it matches a user with an email.</p>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        formControlName="emailAddress"
        autocomplete="email"
      />
      <mat-error *ngIf="form.get('emailAddress')?.hasError('required') && form.get('emailAddress')?.touched"
        >Email is required</mat-error
      >
      <mat-error *ngIf="form.get('emailAddress')?.hasError('email') && form.get('emailAddress')?.touched"
        >Enter a valid email</mat-error
      >
    </mat-form-field>

    <div class="actions">
      <button
        type="submit"
        mat-flat-button
        color="primary"
        [disabled]="!form.valid || loading"
      >
        Send reset link
      </button>
    </div>

    <p class="success" *ngIf="message">{{ message }}</p>
    <p class="error-inline" *ngIf="error">{{ error }}</p>

    <p class="back">
      <a routerLink="/ng/login">Back to login</a>
    </p>
  </form>
</div>
