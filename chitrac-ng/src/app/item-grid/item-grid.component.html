<app-page-load-state [loading]="isLoading" [error]="error" label="Loading items…" (retry)="retryLoad()"></app-page-load-state>
<div [attr.inert]="isLoading || error ? '' : null" [attr.aria-busy]="isLoading">
<base-table
  [columns]="displayedColumns"
  [columnOptions]="columnOptions"
  [rows]="items"
  [rowIdentity]="rowIdentity"
  [selectedRow]="selectedRow"
  [pageSizes]="pageSizes"
  [enableCsvExport]="false"
  [fillAvailableWidth]="true"
  [emptyMessage]="!isLoading && !error ? 'No items found.' : ''"
  [cellTemplates]="{ Image: itemPhoto }"
  (rowClicked)="selectedRow = $event"
></base-table>

<ng-template #itemPhoto let-item>
  <img *ngIf="getPhotoUrl(item.photo) as photoUrl" class="item-photo" [src]="photoUrl" [alt]="item.name + ' image'" />
</ng-template>

<mat-divider></mat-divider>

<div class="cud-buttons">
  <button mat-flat-button (click)="openDialog(null)">
    <mat-icon>add</mat-icon> New Item
  </button>
  <button mat-flat-button [disabled]="!selectedRow" (click)="selectedRow && openDialog(selectedRow)">
    <mat-icon>edit</mat-icon> Edit Item
  </button>
  <button mat-flat-button [disabled]="!selectedRow" (click)="selectedRow && deleteItem(selectedRow)">
    <mat-icon>delete</mat-icon> Delete Item
  </button>
</div>

</div>
