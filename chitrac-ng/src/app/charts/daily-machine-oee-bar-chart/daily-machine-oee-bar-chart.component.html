<!-- charts/daily-machine-oee-bar-chart/daily-machine-oee-bar-chart.component.html -->
<div class="chart-container" [class.dark-mode]="isDarkTheme">
  <div class="loading-overlay" *ngIf="isLoading || (!hasInitialData && dummyMode)">
    <div class="loading-content" role="status" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-text">Loading data...</div>
    </div>
  </div>

  <div class="chart-content" *ngIf="hasInitialData && chartConfig">
    <cartesian-chart [config]="chartConfig"></cartesian-chart>
  </div>

  <div class="chart-no-data" *ngIf="!hasInitialData && !dummyMode && !isLoading">
    <div class="chart-no-data-content">
      <div class="chart-no-data-icon">&#128202;</div>
      <div class="chart-no-data-text">No chart data available</div>
    </div>
  </div>
</div>
