<div class="chart-container" [class.dark-mode]="isDarkTheme">
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading data...</div>
    </div>
  </div>

  <div class="chart-content" *ngIf="hasInitialData && chartConfig">
    <cartesian-chart
      [config]="chartConfig"
      (barClick)="onBarClick($event)">
    </cartesian-chart>
  </div>

  <ng-template #dummy>
    <div class="dummy-chart-content" *ngIf="!hasInitialData && dummyMode">
      <div class="loading-spinner dummy-chart">⏳</div>
    </div>
  </ng-template>
</div>
