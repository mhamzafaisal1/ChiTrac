<div class="login-popup">
  <form [formGroup]="userLoginFormGroup" (submit)="onSubmit($event)">
    <h3 class="login-title">Login</h3>
    
    <mat-form-field appearance="outline" class="full-width" [hideRequiredMarker]="true">
      <mat-label>Username</mat-label>
      <input #usernameInput matInput type="text" formControlName="username" placeholder="Enter username" />
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="full-width" [hideRequiredMarker]="true">
      <mat-label>{{ passwordFieldLabel }}</mat-label>
      <input #passwordInput matInput type="password" formControlName="password" [placeholder]="passwordFieldPlaceholder" />
    </mat-form-field>
    
    <button type="submit" mat-flat-button color="primary" class="full-width login-btn" 
            [disabled]="!userLoginFormGroup.valid || isLoggingIn"
            (click)="$event.stopPropagation()">
      <mat-icon>login</mat-icon>
      Log In
    </button>
    
    <div *ngIf="error" class="error-message" role="alert">
      {{ error }}
    </div>
  </form>
</div>
