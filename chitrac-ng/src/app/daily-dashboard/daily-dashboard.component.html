<div class="dashboard-container" [class.dark-mode]="isDarkTheme" [class.layout-editing]="layoutEditing">
  <div class="dashboard-wrapper">
    <button
      class="chart-library-button"
      type="button"
      *ngIf="layoutEditing"
      (click)="openChartVisibilityDialog()"
      aria-label="Edit chart layout"
    >
      <mat-icon>dashboard_customize</mat-icon>
      <span>Edit Layout</span>
    </button>

    <div
      class="charts-grid"
      [class.layout-two-by-two]="gridLayout === '2x2'"
      [style.--chart-columns]="gridLayout === '2x2' ? 2 : 3"
      #chartsGrid
      cdkDropList
      cdkDropListOrientation="mixed"
      (cdkDropListDropped)="onChartDrop($event)"
    >
      <div
        class="chart-shell"
        cdkMonitorElementFocus
        *ngFor="let tile of visibleChartTiles; trackBy: trackTile"
        cdkDrag
        [cdkDragDisabled]="!layoutEditing"
        [attr.role]="layoutEditing ? null : 'button'"
        [attr.tabindex]="layoutEditing ? null : 0"
        [attr.aria-label]="'Enlarge ' + tile.title"
        [attr.aria-haspopup]="layoutEditing ? null : 'dialog'"
        (click)="openChartDetail(tile)"
        (keydown.enter)="openChartDetail(tile)"
        (keydown.space)="$event.preventDefault(); openChartDetail(tile)"
      >
        <button
          class="chart-drag-handle"
          type="button"
          cdkDragHandle
          *ngIf="layoutEditing"
          aria-label="Drag to reorder chart"
        >
          <mat-icon>drag_indicator</mat-icon>
        </button>

        @if (tile.id === 'machine-timeline') {
          <app-chart-tile
            [title]="tile.title" [icon]="tile.icon"
            [subtitle]="chartSubtitle(tile)" [subtitleStrong]="chartSubtitleStrong(tile)"
            [updatedAt]="cacheUpdatedAt" [chartWidth]="chartWidth" [chartHeight]="chartHeight"
          >
            <app-timeline-zoom-controls chartTileActions class="header-controls"
              [canZoomIn]="timeline.canZoomIn" [canZoomOut]="timeline.canZoomOut"
              (zoomIn)="timeline.zoomBy(2)" (zoomOut)="timeline.zoomBy(0.5)" (reset)="timeline.resetZoom()"
            ></app-timeline-zoom-controls>
            <app-machine-timeline-chart #timeline
              [chartWidth]="chartWidth" [chartHeight]="chartHeight"
              [preloadedData]="preloadedData?.machineTimeline"
              [useExternalTitle]="useTileTitles" [controlsInHeader]="true"
            ></app-machine-timeline-chart>
          </app-chart-tile>
        } @else {
        <app-chart-tile
          [class.daily-count-editing]="tile.id === 'daily-counts' && layoutEditing"
          [class.yesterday-editing]="yesterdayChartIds.includes(tile.id) && layoutEditing"
          [title]="tile.title"
          [icon]="tile.icon"
          [subtitle]="chartSubtitle(tile)"
          [subtitleStrong]="chartSubtitleStrong(tile)"
          [updatedAt]="cacheUpdatedAt"
          [chartWidth]="chartWidth"
          [chartHeight]="chartHeight"
        >
          <div chartTileActions *ngIf="tile.id === 'daily-counts' && layoutEditing"
            class="daily-count-controls" role="group" aria-label="Daily count chart display"
            (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()"
            (pointerdown)="$event.stopPropagation()">
            <mat-slide-toggle
              [checked]="dailyCountDisplayOptions.averageLine"
              aria-label="Show average line"
              (change)="setDailyCountOption('averageLine', $event.checked)">Average line</mat-slide-toggle>
            <mat-slide-toggle
              [checked]="dailyCountDisplayOptions.barColors"
              aria-label="Use variance bar colors"
              (change)="setDailyCountOption('barColors', $event.checked)">Bar colors</mat-slide-toggle>
          </div>

          <div chartTileActions *ngIf="yesterdayChartIds.includes(tile.id) && layoutEditing"
            class="yesterday-controls" role="group" aria-label="Previous-day chart comparison"
            (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()"
            (pointerdown)="$event.stopPropagation()">
            <mat-slide-toggle
              [checked]="yesterdayVisibility[tile.id] !== false"
              [aria-label]="'Show Yesterday comparison for ' + tile.title"
              (change)="setYesterdayVisibility(tile.id, $event.checked)">Yesterday</mat-slide-toggle>
          </div>

          <app-daily-machine-stacked-bar-chart
            *ngIf="tile.id === 'machine-status'"
            [chartWidth]="chartWidth"
            [chartHeight]="chartHeight"
            [preloadedData]="preloadedData?.machineStatus"
            [useExternalTitle]="useTileTitles"
          ></app-daily-machine-stacked-bar-chart>

          <app-daily-machine-oee-bar-chart
            *ngIf="tile.id === 'machine-oee'"
            [chartWidth]="chartWidth"
            [chartHeight]="chartHeight"
            [preloadedData]="preloadedData?.machineOee"
            [showYesterday]="yesterdayVisibility[tile.id] !== false"
            [useExternalTitle]="useTileTitles"
          ></app-daily-machine-oee-bar-chart>

          <app-daily-count-by-item-chart
            *ngIf="tile.id === 'item-totals'"
            [chartWidth]="chartWidth"
            [chartHeight]="chartHeight"
            [preloadedData]="preloadedData?.itemTotals"
            [showYesterday]="yesterdayVisibility[tile.id] !== false"
            [marginTop]="50"
            [marginRight]="30"
            [marginBottom]="50"
            [marginLeft]="120"
            [useExternalTitle]="useTileTitles"
          ></app-daily-count-by-item-chart>

          <app-efficiency-by-machine-group-bar-chart
            *ngIf="tile.id === 'machine-group-efficiency'"
            [chartWidth]="chartWidth"
            [chartHeight]="chartHeight"
            [preloadedData]="preloadedData?.machineGroupEfficiency"
            [showYesterday]="yesterdayVisibility[tile.id] !== false"
            [useExternalTitle]="useTileTitles"
          ></app-efficiency-by-machine-group-bar-chart>

          <app-ranked-operator-bar-chart
            *ngIf="tile.id === 'top-operators'"
            [chartWidth]="chartWidth"
            [chartHeight]="chartHeight"
            [preloadedData]="preloadedData?.topOperators"
            [showYesterday]="yesterdayVisibility[tile.id] !== false"
            [useExternalTitle]="useTileTitles"
          ></app-ranked-operator-bar-chart>

          <app-daily-count-bar-chart
            *ngIf="tile.id === 'daily-counts'"
            [chartWidth]="chartWidth"
            [chartHeight]="chartHeight"
            [preloadedData]="preloadedData?.dailyCounts"
            [displayOptions]="dailyCountDisplayOptions"
            [useExternalTitle]="useTileTitles"
          ></app-daily-count-bar-chart>
        </app-chart-tile>
        }
      </div>
    </div>
  </div>
</div>
